<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>You're Invited</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <canvas id="confetti"></canvas>

    <header class="topbar">
      <span class="wordmark">danishpastry</span>
      <button class="share-btn" id="share-btn" type="button">Share</button>
    </header>

    <main class="page">
      <p class="invite-chip" id="invite-chip"></p>
      <h1 id="title"></h1>
      <div class="poster" id="poster"></div>

      <div class="when">
        <p class="date" id="date-line"></p>
        <p class="time" id="time-line"></p>
      </div>

      <p class="hosted-label">Hosted by</p>
      <div class="host-chip">
        <span class="avatar" id="host-initial"></span>
        <span class="host-name" id="host"></span>
      </div>

      <div class="rows" id="rows"></div>

      <div id="rsvp-block">
        <p class="section-label">Are you in?</p>
        <div class="rsvp-buttons" id="rsvp-buttons"></div>
      </div>

      <div class="status" id="status">
        <h2 id="status-title"></h2>
        <p id="status-sub"></p>
        <div class="cal-buttons" id="cal-buttons"></div>
        <button class="change-rsvp" id="change-rsvp">Change my answer</button>
      </div>

      <p class="description" id="description"></p>

      <section class="guests">
        <div class="guests-head">
          <h3>Guests</h3>
          <span class="guest-count" id="guest-count"></span>
        </div>
        <div class="guest-avatars" id="guest-avatars"></div>
      </section>

      <p class="footer">danishpastry.org</p>
    </main>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
