<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>You're Invited</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>
    <canvas id="confetti"></canvas>

    <main class="layout">
      <div class="col-title">
        <h1 id="title"></h1>
      </div>

      <aside class="col-side">
        <div class="poster" id="poster"></div>
        <div class="rsvp-card" id="rsvp-block">
          <div class="rsvp-buttons" id="rsvp-buttons"></div>
        </div>
        <div class="status" id="status">
          <h2 id="status-title"></h2>
          <p id="status-sub"></p>
          <div class="cal-buttons" id="cal-buttons"></div>
          <button class="change-rsvp" id="change-rsvp">Change my answer</button>
        </div>
      </aside>

      <div class="col-info">
        <div class="when">
          <p class="date" id="date-line"></p>
          <p class="time" id="time-line"></p>
        </div>

        <p class="hosted-label">♛ Hosted by</p>
        <div class="host-chip">
          <span class="avatar" id="host-initial"></span>
          <span class="host-name" id="host"></span>
        </div>

        <div class="rows" id="rows"></div>

        <p class="description" id="description"></p>

        <div class="sections" id="sections"></div>

        <section class="guests">
          <div class="guests-head">
            <h3>Guest List</h3>
            <span class="guest-count" id="guest-count"></span>
          </div>
          <div class="guest-avatars" id="guest-avatars"></div>
        </section>
      </div>
    </main>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
